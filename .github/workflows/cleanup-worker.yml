# .github/workflows/cleanup-worker.yml
name: Scheduled Cleanup Worker

on:
  schedule:
    # Trigger daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for quick testing

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Configuration Secrets
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "=========================================================================="
            echo "❌ CRITICAL CONFIGURATION FAILURE"
            echo "=========================================================================="
            echo "Your GitHub Actions Secrets are incomplete! Please configure:"
            echo "  - PRODUCTION_URL (e.g., https://your-nas-app.vercel.app)"
            echo "  - CRON_SECRET (matching the CRON_SECRET value set in Vercel)"
            echo "=========================================================================="
            exit 1
          fi

      - name: Trigger Failed Upload Cleanup Worker
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering failed upload SRE quarantine worker..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"worker": "failed_upload_cleanup"}' \
            "$PRODUCTION_URL/api/admin/workers/trigger")
          
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"
          
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 409 ]; then
            echo "❌ Worker run failed with status $STATUS"
            exit 1
          fi

      - name: Trigger Orphan Chunk Cleanup Worker
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering Google Drive orphan chunk purge worker..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"worker": "orphan_cleanup"}' \
            "$PRODUCTION_URL/api/admin/workers/trigger")
          
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"
          
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 409 ]; then
            echo "❌ Worker run failed with status $STATUS"
            exit 1
          fi
