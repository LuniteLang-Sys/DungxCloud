# .github/workflows/deploy.yml
name: Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js pinned version 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Clean install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Code Quality & Code Style validation
      - name: Lint Verification
        run: npm run lint
        continue-on-error: true

      # 5. TypeScript static analysis
      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      # 6. Run unit tests if configured, or run compile validation tests
      - name: Run Build Tests
        run: |
          if npm run | grep -q "test"; then
            npm run test
          else
            echo "No test scripts configured in package.json. Skipping testing."
          fi

      # 7. Production compilation validation with environment safety bypasses
      - name: Verify Build Compiles
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://iykapuisyiynmqipjhcn.supabase.co' # dummy compile-time env
          SUPABASE_SERVICE_ROLE_KEY: 'dummy-service-key-for-compilation'
        run: npm run build

      # 8. Deploy directly to Railway production on branch push only
      - name: Continuous Deployment to Railway
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli
          echo "Uploading code and triggering deployment to Railway..."
          railway up --detach

