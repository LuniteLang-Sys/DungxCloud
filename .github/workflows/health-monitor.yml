# .github/workflows/health-monitor.yml
name: Scheduled Health Monitor Worker

on:
  schedule:
    # Trigger every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for quick testing

jobs:
  run-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Configuration Secrets
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "=========================================================================="
            echo "❌ CRITICAL CONFIGURATION FAILURE"
            echo "=========================================================================="
            echo "Your GitHub Actions Secrets are incomplete! Please configure:"
            echo "  - PRODUCTION_URL (e.g., https://your-nas-app.up.railway.app)"
            echo "=========================================================================="
            exit 1
          fi

      - name: Probe Central Aggregated Health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "Pinging Central Aggregated Health endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$PRODUCTION_URL/api/health")
          
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "HTTP Status: $STATUS"
          echo "Payload Output:"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Central health status checks have FAILED! Service is currently degraded or down."
            exit 1
          fi

      - name: Probe Subsystem - Database Health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "Pinging DB Health check endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$PRODUCTION_URL/api/health/db")
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "HTTP Status: $STATUS"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Supabase DB health connection is DOWN!"
            exit 1
          fi

      - name: Probe Subsystem - NAS Storage Health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "Pinging NAS Storage Pools Health check endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$PRODUCTION_URL/api/health/storage")
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "HTTP Status: $STATUS"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ NAS Virtual Storage pools are degraded or down!"
            exit 1
          fi

      - name: Probe Subsystem - Google API Health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "Pinging Google API Health check endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$PRODUCTION_URL/api/health/google")
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "HTTP Status: $STATUS"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Google API probe connections are DOWN!"
            exit 1
          fi
